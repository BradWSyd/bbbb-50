<style>
  :root {
    --black: #000000;
    --paper: #FFFDFD;
    --paper-soft: rgba(255, 253, 253, 0.78);
    --paper-faint: rgba(255, 253, 253, 0.16);
    --placeholder: rgba(255, 253, 253, 0.06);
    --crusta: #FF7E2C;
    --razzmatazz: #F42168;
    --turquoise: #71E6E8;
    --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--black); }
  html, body { overflow-x: clip; }
  body {
    margin: 0; background: var(--black); color: var(--paper);
    font-family: var(--font); font-size: 1.0625rem; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(100% - 2.5rem, 44rem); margin-inline: auto; }
  a { color: var(--paper); text-underline-offset: .2em; text-decoration-color: var(--crusta); }
  :focus-visible { outline: 2px solid var(--turquoise); outline-offset: 3px; }

  .top { padding: 1rem 0 0; }
  .back { display: inline-block; padding: .75rem 0; font-size: .9375rem; color: var(--paper-soft); }

  /* Hero: logo, then one line of copy */
  .hero { text-align: center; padding: 2rem 0 2.5rem; }
  .hero video, .hero .logo { width: min(100%, 36rem); height: auto; display: block; margin: 0 auto; background: var(--black); }
  /* Big "20" in the logo's colour sweep, like the social countdown tiles */
  .hero h1 { margin: 1.5rem 0 0; font-weight: 400; line-height: 1; }
  .hero h1 .big {
    display: inline-block; font-weight: 700; font-size: clamp(5rem, 24vw, 8rem); line-height: .9; letter-spacing: -.03em;
    background: linear-gradient(100deg, #FF7E2C, #F42168, #E024C8, #8B3BF2, #2F6BFF, #71E6E8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero h1 .lab { display: block; margin-top: .6rem; font-weight: 600; font-size: clamp(.8rem, 3.2vw, 1rem); letter-spacing: .3em; padding-left: .3em; text-transform: uppercase; }
  .hero h1 .yrs { display: block; margin-top: .5rem; color: var(--paper-soft); font-size: clamp(.8rem, 3vw, .9375rem); letter-spacing: .08em; }

  /* The wall: same-size square tiles that read left to right.
     Invite graphics take a full row so their text isn't cropped. */
  .wall {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-flow: dense;
    gap: 3px; width: min(100%, 76rem); margin: 0 auto;
  }
  @media (min-width: 40rem) { .wall { grid-template-columns: repeat(4, 1fr); gap: 4px; padding-inline: 1rem; } }
  @media (min-width: 64rem) { .wall { grid-template-columns: repeat(5, 1fr); } }
  .tile {
    position: relative; display: block; padding: 0; border: 0; margin: 0; cursor: zoom-in;
    aspect-ratio: 1; overflow: hidden; background: var(--placeholder); border-radius: 2px;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.wide {
    grid-column: 1 / -1; aspect-ratio: auto; background: var(--black);
    padding: 1.25rem 0; display: flex; justify-content: center;
  }
  .tile.wide img { width: auto; height: auto; max-width: min(100% - 1.5rem, 46rem); max-height: min(60vh, 30rem); border-radius: 4px; }
  .tile.vid { cursor: pointer; }
  .tile.yt img.hq { transform: scale(1.34); }
  .play {
    position: absolute; inset: 50% auto auto 50%; width: 3rem; height: 3rem; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--paper); box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
  }
  .play::after {
    content: ""; position: absolute; left: 54%; top: 50%; transform: translate(-50%, -50%);
    border-style: solid; border-width: .5rem 0 .5rem .8rem; border-color: transparent transparent transparent var(--black);
  }

  .notes { padding: 3.5rem 0 1rem; color: var(--paper-soft); font-size: .95rem; }
  .notes p { margin: 0 0 1rem; }
  .notes a { overflow-wrap: anywhere; }

  .finale { text-align: center; padding: 2rem 0 2.5rem; border-top: 1px solid var(--paper-faint); margin-top: 2rem; }
  .finale video, .finale img { width: min(100%, 26rem); height: auto; display: block; margin: 0 auto; background: var(--black); }
  .cta {
    display: inline-block; padding: 1rem 2rem; border-radius: 999px; background: var(--crusta);
    color: var(--black); font-weight: 600; text-decoration: none;
  }
  footer { padding: 0 0 3rem; text-align: center; color: var(--paper-soft); font-size: .9375rem; }

  /* Lightbox */
  dialog {
    border: 0; padding: 0; background: rgba(0, 0, 0, .96); color: var(--paper);
    width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .96); }
  .lb { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
  .lb img, .lb video { max-width: 96vw; max-height: 82dvh; object-fit: contain; border-radius: 4px; }
  .lb iframe { width: min(96vw, calc(82dvh * 16 / 9)); aspect-ratio: 16 / 9; height: auto; border: 0; border-radius: 4px; background: #000; }
  .lb button {
    position: absolute; background: rgba(0, 0, 0, .5); color: var(--paper); border: 1px solid var(--paper-faint);
    border-radius: 999px; width: 3rem; height: 3rem; font: inherit; font-size: 1.4rem; cursor: pointer;
  }
  .lb .x { top: max(1rem, env(safe-area-inset-top)); right: 1rem; }
  .lb .prev { left: .75rem; top: 50%; transform: translateY(-50%); }
  .lb .next { right: .75rem; top: 50%; transform: translateY(-50%); }
  .lb .count {
    position: absolute; bottom: max(1rem, env(safe-area-inset-bottom)); left: 0; right: 0;
    margin: 0; text-align: center; color: var(--paper-soft); font-size: .9375rem; font-variant-numeric: tabular-nums;
  }
</style>

<dialog id="lb" aria-label="Photo viewer">
  <div class="lb">
    <img id="lb-img" alt="">
    <video id="lb-vid" controls playsinline hidden></video>
    <div id="lb-yt" hidden></div>
    <button class="x" id="lb-x" type="button" aria-label="Close">×</button>
    <button class="prev" id="lb-prev" type="button" aria-label="Previous">‹</button>
    <button class="next" id="lb-next" type="button" aria-label="Next">›</button>
    <p class="count" id="lb-count" aria-live="polite"></p>
  </div>
</dialog>

<script>
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Hero shimmer loops; reduced motion keeps the still logo. */
  const hero = document.getElementById("hero-loop");
  if (reduce) { hero.removeAttribute("src"); hero.load(); } else { hero.play().catch(() => {}); }

  /* Finale paint-on plays once when it comes into view, then holds the last frame. */
  const fin = document.getElementById("finale-video");
  if (reduce) { fin.removeAttribute("src"); fin.load(); }
  else new IntersectionObserver((es, o) => {
    if (es[0].isIntersecting) { fin.play().catch(() => {}); o.disconnect(); }
  }, { threshold: .5 }).observe(fin);

  /* Load tiles well before they scroll into view, so a fast swipe doesn't land on empty squares. */
  const ahead = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.loading = "eager"; ahead.unobserve(e.target); }
  }), { rootMargin: "1800px 0px" });
  document.querySelectorAll('.tile img[loading="lazy"]').forEach(img => ahead.observe(img));

  /* Tap a tile to view it large. Swipe, arrows or keys to move through the whole wall. */
  const tiles = [...document.querySelectorAll(".tile")];
  const lb = document.getElementById("lb"), big = document.getElementById("lb-img"),
        vid = document.getElementById("lb-vid"), yt = document.getElementById("lb-yt"),
        count = document.getElementById("lb-count");
  /* YouTube plays inside the viewer (privacy-enhanced embed). Clearing it stops playback. */
  function stopYT() { yt.hidden = true; yt.replaceChildren(); }
  function playYT(id) {
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&playsinline=1&modestbranding=1";
    f.title = "YouTube video"; f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
    yt.replaceChildren(f); yt.hidden = false;
  }
  let cur = 0;
  function warm(i) { const t = tiles[(i + tiles.length) % tiles.length]; if (t && t.dataset.full) new Image().src = t.dataset.full; }
  function show(i) {
    cur = (i + tiles.length) % tiles.length;
    const t = tiles[cur];
    vid.pause(); stopYT();
    if (t.dataset.youtube) {
      big.hidden = true; big.removeAttribute("src");
      vid.hidden = true; vid.removeAttribute("src"); vid.load();
      playYT(t.dataset.youtube);
    } else if (t.dataset.video) {
      big.hidden = true; big.removeAttribute("src");
      vid.hidden = false; vid.poster = t.dataset.poster; vid.src = t.dataset.video; vid.play().catch(() => {});
    } else {
      vid.hidden = true; vid.removeAttribute("src"); vid.load();
      big.hidden = false; big.src = t.dataset.full; big.alt = t.querySelector("img").alt;
    }
    count.textContent = (cur + 1) + " of " + tiles.length;
    warm(cur + 1); warm(cur - 1);
  }
  function close() { vid.pause(); stopYT(); lb.close(); }
  tiles.forEach((t, i) => t.addEventListener("click", () => { show(i); lb.showModal(); }));
  lb.addEventListener("close", () => { vid.pause(); stopYT(); tiles[cur].focus({ preventScroll: true }); });
  document.getElementById("lb-x").onclick = close;
  document.getElementById("lb-prev").onclick = () => show(cur - 1);
  document.getElementById("lb-next").onclick = () => show(cur + 1);
  lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb")) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.open) return;
    if (e.key === "ArrowRight") show(cur + 1);
    if (e.key === "ArrowLeft") show(cur - 1);
  });
  let x0 = null;
  lb.addEventListener("touchstart", e => { x0 = e.target === vid ? null : e.touches[0].clientX; }, { passive: true });  // let video scrubbing alone
  lb.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    x0 = null;
  });
</script>
